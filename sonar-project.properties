# figma/ is a standalone Figma Make export (its own pnpm-workspace.yaml,
# vite.config.ts) used only as a design reference while porting components
# into frontend/src — it is never built or deployed as part of this app.
# Scanning it alongside real application code produces false "duplication"
# findings between a ported component and the reference it was ported from.
sonar.exclusions=figma/**
