version: 2
updates:
  # ── Frontend (Node.js / pnpm) ──────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(frontend)"
      include: "scope"
    reviewers:
      - "guillermolam"
    versioning-strategy: increase
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      unocss:
        patterns: ["unocss", "@unocss/*"]
      solid:
        patterns: ["solid-js", "@solidjs/*"]

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(actions)"
      include: "scope"
    reviewers:
      - "guillermolam"
