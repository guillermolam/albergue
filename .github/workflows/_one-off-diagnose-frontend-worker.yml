name: One-off - Diagnose frontend Worker

# Read-only manual diagnostic: prints deployment/version history and the
# current routes for the "albergue" Worker to figure out why a
# BACKEND_API_URL secret update didn't change observed behavior on the
# live site. No secret values are printed. To be deleted once diagnosed.

on:
  workflow_dispatch:

concurrency:
  group: diagnose-frontend-worker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    name: Inspect Worker deployments/versions/routes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: $/.github/actions/setup-node-pnpm
        with:
          node-version: "24"
          pnpm-version: "10.29.3"

      - name: Inspect Worker
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "### wrangler whoami"
          pnpm exec wrangler whoami || true
          echo "### deployments list"
          pnpm exec wrangler deployments list || true
          echo "### versions list"
          pnpm exec wrangler versions list || true
