name: One-off - Fix BACKEND_API_URL secret

# Manual, one-time maintenance workflow: sets the frontend Worker's
# BACKEND_API_URL secret to the correct value (it appears to have had a
# stray trailing /api, causing every backend call in production to hit
# /api/api/... and 404). Uses the same CLOUDFLARE_API_TOKEN/
# CLOUDFLARE_ACCOUNT_ID secrets that deploy-cloudflare.sh already uses.
# Delete this file once the fix is confirmed -- it's not meant to be
# permanent CI surface.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix-secret:
    name: Set BACKEND_API_URL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: $/.github/actions/setup-node-pnpm
        with:
          node-version: "24"
          pnpm-version: "10.29.3"

      - name: Set BACKEND_API_URL secret on the frontend Worker
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "https://albergue-backend.alberguecarrascalejo.workers.dev" | pnpm exec wrangler secret put BACKEND_API_URL
