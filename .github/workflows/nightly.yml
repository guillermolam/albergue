name: Nightly Release Pipeline

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# Set minimal permissions globally
permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-dependabot:
    name: Check Dependabot PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # required for `gh pr list` to query dependency PRs
    outputs:
      pr_count: ${{ steps.count.outputs.count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Count Dependabot PRs
        id: count
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/count-dependabot-prs.sh

  validate:
    name: Validate Dependencies
    permissions:
      contents: read
    needs: check-dependabot
    if: ${{ needs.check-dependabot.outputs.pr_count != '0' }}
    # trunk-ignore(actionlint/workflow-call): $/ is GitHub's self-repository syntax (2026-07); Trunk's bundled actionlint predates it.
    uses: $/.github/workflows/_reusable-frontend-setup.yml
    with:
      script: run-nightly-validation.sh

  auto-merge:
    name: Auto-Merge Dependabot PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # required for `gh pr merge --auto`
    needs: [validate]
    if: ${{ needs.validate.result == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Auto-merge Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/auto-merge-dependabot-prs.sh

  nightly-release:
    name: Create Nightly Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # required for `gh release create`
    needs: [check-dependabot, auto-merge]
    if: ${{ needs.check-dependabot.outputs.pr_count != '0' && needs.auto-merge.result == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate nightly version
        id: version
        run: ./.github/scripts/generate-nightly-version.sh

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ steps.version.outputs.version }}
        run: ./.github/scripts/create-nightly-release.sh

  deploy-cloudflare:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Must run every time this workflow runs -- `nightly-release` only
    # succeeds when there are pending Dependabot PRs, so depending on it
    # here was silently skipping every deploy whenever there were none.
    # Also waits on migrate-database: this Worker now bundles the backend
    # too (frontend and backend merged into one deployment -- see
    # frontend/src/lib/backend-api.ts), so new backend code should never
    # run against a database schema it hasn't been migrated to yet.
    needs: [check-dependabot, migrate-database]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js and pnpm
        # trunk-ignore(actionlint/action): $/ is GitHub's self-repository syntax (2026-07); Trunk's bundled actionlint predates it.
        uses: $/.github/actions/setup-node-pnpm
        with:
          node-version: "24"
          pnpm-version: "10.29.3"

      - name: Build frontend for Cloudflare
        # PUBLIC_SMPLR_* are client vars inlined into the built bundle by
        # Astro/Vite at build time -- frontend/scripts/root-env.mjs only
        # fills these from the (gitignored, CI-absent) monorepo-root .env
        # when they're NOT already set, so setting them here is what
        # actually gets the 3D floor plan working in production (it was
        # silently falling back to the "not configured" placeholder on
        # every deploy before this).
        env:
          PUBLIC_SMPLR_ORGANIZATION_ID: ${{ secrets.PUBLIC_SMPLR_ORGANIZATION_ID }}
          PUBLIC_SMPLR_CLIENT_TOKEN: ${{ secrets.PUBLIC_SMPLR_CLIENT_TOKEN }}
          PUBLIC_SMPLR_SPACE_B01_ID: ${{ secrets.PUBLIC_SMPLR_SPACE_B01_ID }}
        run: ./.github/scripts/build-frontend-target.sh cloudflare

      - name: Deploy to Cloudflare
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: ../.github/scripts/deploy-cloudflare.sh

  migrate-database:
    name: Apply database migrations
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Must run every time this workflow runs -- `nightly-release` only
    # succeeds when there are pending Dependabot PRs, so depending on it
    # here was silently skipping every deploy whenever there were none.
    needs: check-dependabot
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js and pnpm
        # trunk-ignore(actionlint/action): $/ is GitHub's self-repository syntax (2026-07); Trunk's bundled actionlint predates it.
        uses: $/.github/actions/setup-node-pnpm
        with:
          node-version: "24"
          pnpm-version: "10.29.3"

      - name: Apply migrations to production database
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: ../.github/scripts/migrate-database.sh

  deploy-netlify:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Must run every time this workflow runs -- `nightly-release` only
    # succeeds when there are pending Dependabot PRs, so depending on it
    # here was silently skipping every deploy whenever there were none.
    needs: check-dependabot
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js and pnpm
        # trunk-ignore(actionlint/action): $/ is GitHub's self-repository syntax (2026-07); Trunk's bundled actionlint predates it.
        uses: $/.github/actions/setup-node-pnpm
        with:
          node-version: "24"
          pnpm-version: "10.29.3"

      - name: Deploy to Netlify
        working-directory: frontend
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: ../.github/scripts/deploy-netlify.sh

  smoke-test:
    name: Smoke test live pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Frontend and backend are one deployment now (see
    # frontend/src/lib/backend-api.ts) -- this only means anything checked
    # against the final deployed state of deploy-cloudflare.
    needs: [deploy-cloudflare]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Smoke test live pages
        # Catches the class of bug this class of change keeps hitting: a
        # broken Worker-to-Worker backend call that doesn't error, it hangs
        # for ~30s until Cloudflare's own platform timeout kills the
        # request. A human noticing that live was what caught it last time
        # -- this should have been automatic.
        run: ./.github/scripts/smoke-test-live-pages.sh https://albergue.alberguecarrascalejo.workers.dev
