name: Nightly Release Pipeline

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Set minimal permissions globally
permissions:
  contents: read

jobs:
  check-dependabot:
    name: Check Dependabot PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_count: ${{ steps.count.outputs.count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Count Dependabot PRs
        id: count
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/count-dependabot-prs.sh

  validate:
    name: Validate Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: check-dependabot
    if: needs.check-dependabot.outputs.pr_count > 0
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: $/.github/actions/setup-node-pnpm
        with:
          node-version: '24'
          pnpm-version: '10.29.3'

      - name: Build frontend
        run: pnpm --filter albergue-carrascalejo-frontend build

      - name: Type check
        run: pnpm --filter albergue-carrascalejo-frontend type-check

  auto-merge:
    name: Auto-Merge Dependabot PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    needs: [validate]
    if: needs.validate.outputs.conclusion == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Auto-merge Dependabot PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/auto-merge-dependabot-prs.sh

  nightly-release:
    name: Create Nightly Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [check-dependabot, auto-merge]
    if: needs.check-dependabot.outputs.pr_count > 0 && needs.auto-merge.outputs.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate nightly version
        id: version
        run: ./.github/scripts/generate-nightly-version.sh

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION_TAG" \
            --title "Nightly Release $VERSION_TAG" \
            --notes "## Nightly Release

          Built from latest main branch including dependency updates." \
            --prerelease

  deploy-cloudflare:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: nightly-release
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: $/.github/actions/setup-node-pnpm
        with:
          node-version: '24'
          pnpm-version: '10.29.3'

      - name: Build frontend for Cloudflare
        run: pnpm --filter albergue-carrascalejo-frontend build:cloudflare

      - name: Deploy to Cloudflare
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '798e36259a38e6217cc9987ce0bf1316' }}
        run: pnpm exec wrangler deploy
