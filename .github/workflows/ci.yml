name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Set minimal permissions globally
permissions:
  contents: read

env:
  NODE_ENV: test
  PUBLIC_API_MODE: local

jobs:
  frontend-quality:
    name: Frontend quality and smoke
    permissions:
      contents: read
    uses: ./.github/workflows/_reusable-frontend-setup.yml
    with:
      command: ./.github/scripts/run-frontend-quality.sh
      install-playwright: true

  frontend-builds:
    name: Frontend build (${{ matrix.target }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [cloudflare, netlify, stormkit]
    uses: ./.github/workflows/_reusable-frontend-setup.yml
    with:
      command: ./.github/scripts/build-frontend-target.sh "${{ matrix.target }}"

  backend:
    name: Hono backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '24'
          pnpm-version: '10.29.3'
      
      - name: Run backend pipeline
        run: ./.github/scripts/run-backend-checks.sh

  database:
    name: PostgreSQL migration baseline
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: albergue_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      PGPASSWORD: postgres
      DATABASE_HOST: localhost
      DATABASE_USER: postgres
      DATABASE_NAME: albergue_test
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '24'
          pnpm-version: '10.29.3'
      
      - name: Check migration files
        run: pnpm --filter @albergue/domain-model migration:check
      
      - name: Apply journaled Drizzle migrations
        run: ./.github/scripts/apply-migrations.sh
      
      - name: Verify authoritative database schema
        run: ./.github/scripts/verify-database-schema.sh
