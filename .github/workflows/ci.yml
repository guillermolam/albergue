name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_ENV: test
  PUBLIC_API_MODE: local

jobs:
  frontend-quality:
    name: Frontend quality and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter albergue-carrascalejo-frontend format:check
      - run: pnpm --filter albergue-carrascalejo-frontend type-check
      - run: pnpm --filter albergue-carrascalejo-frontend check:astro
      - name: Full TypeScript debt report
        continue-on-error: true
        run: pnpm --filter albergue-carrascalejo-frontend type-check:full
      - name: Full Astro debt report
        continue-on-error: true
        run: pnpm --filter albergue-carrascalejo-frontend check:astro:full
      - run: pnpm --filter albergue-carrascalejo-frontend exec playwright install --with-deps chromium
      - run: pnpm --filter albergue-carrascalejo-frontend e2e

  frontend-builds:
    name: Frontend build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [cloudflare, netlify, stormkit]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter albergue-carrascalejo-frontend build:${{ matrix.target }}

  backend:
    name: Hono backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter albergue-backend type-check
      - run: pnpm --filter albergue-backend test

  database:
    name: PostgreSQL migration baseline
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: albergue_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @albergue/domain-model migration:check
      - name: Apply journaled Drizzle migrations
        run: |
          for tag in $(node -e "JSON.parse(require('fs').readFileSync('domain_model/migrations/meta/_journal.json','utf8')).entries.forEach(e=>console.log(e.tag))"); do
            echo "Applying $tag"
            psql -h localhost -U postgres -d albergue_test -v ON_ERROR_STOP=1 -f "domain_model/migrations/${tag}.sql"
          done
      - name: Verify authoritative tables
        run: |
          test "$(psql -h localhost -U postgres -d albergue_test -Atc \
            "select count(*) from information_schema.tables where table_schema='public' and table_name in ('users','pilgrims','beds','bookings','payments','pricing','government_submissions','notifications','audit_log')")" = "9"
          test "$(psql -h localhost -U postgres -d albergue_test -Atc \
            "select count(*) from information_schema.columns where table_schema='public' and table_name='government_submissions' and column_name='updated_at'")" = "1"
          test "$(psql -h localhost -U postgres -d albergue_test -Atc \
            "select count(*) from information_schema.columns where table_schema='public' and table_name='notifications' and column_name='attempts'")" = "1"
