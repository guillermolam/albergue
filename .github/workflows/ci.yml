name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Set minimal permissions globally
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  PUBLIC_API_MODE: local

jobs:
  frontend-quality:
    name: Frontend quality and smoke
    permissions:
      contents: read
    uses: $/.github/workflows/_reusable-frontend-setup.yml
    with:
      script: run-frontend-quality.sh
      install-playwright: true

  frontend-builds:
    name: Frontend build (${{ matrix.target }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [cloudflare, netlify, stormkit]
    uses: $/.github/workflows/_reusable-frontend-setup.yml
    with:
      script: build-frontend-target.sh
      script-args: ${{ matrix.target }}

  backend:
    name: Hono backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: $/.github/actions/setup-node-pnpm
        with:
          node-version: "24"
          pnpm-version: "10.29.3"

      - name: Run backend pipeline
        run: ./.github/scripts/run-backend-checks.sh

  database:
    name: PostgreSQL migration baseline
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        # postgres:15, digest pinned (zizmor unpinned-images)
        image: postgres:15@sha256:9b1d34adbce1dd07ee6e94b4a2cf698884b89bd44a6c9c12f5da8f3acbfe4957
        env:
          POSTGRES_DB: albergue_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      PGPASSWORD: postgres
      DATABASE_HOST: localhost
      DATABASE_USER: postgres
      DATABASE_NAME: albergue_test
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: $/.github/actions/setup-node-pnpm
        with:
          node-version: "24"
          pnpm-version: "10.29.3"

      - name: Check migration files
        run: ./.github/scripts/check-migrations.sh

      - name: Apply journaled Drizzle migrations
        run: ./.github/scripts/apply-migrations.sh

      - name: Verify authoritative database schema
        run: ./.github/scripts/verify-database-schema.sh
