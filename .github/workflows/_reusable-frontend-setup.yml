name: "Reusable Frontend Setup"

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        type: string
        default: "24"
      pnpm-version:
        description: "pnpm version to use"
        type: string
        default: "10.29.3"
      install-playwright:
        description: "Install Playwright Chromium browser"
        type: boolean
        default: false
      script:
        description: "Basename of a script under .github/scripts/"
        type: string
        required: true
      script-args:
        description: "Optional single argument forwarded to the script"
        type: string
        required: false
        default: ""

permissions: {}

jobs:
  setup:
    name: Setup Frontend Environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js and pnpm
        # trunk-ignore(actionlint/action): $/ is GitHub's self-repository syntax (2026-07); Trunk's bundled actionlint predates it.
        uses: $/.github/actions/setup-node-pnpm
        with:
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}

      - name: Install Playwright browsers
        if: ${{ inputs.install-playwright }}
        run: ./.github/scripts/install-playwright.sh

      - name: Build workspace packages
        run: pnpm --filter @albergue/api-contract --filter @albergue/domain-model build

      - name: Run requested script
        env:
          CALLED_SCRIPT: ${{ inputs.script }}
          CALLED_ARGS: ${{ inputs.script-args }}
        run: ./.github/scripts/run-called-script.sh
