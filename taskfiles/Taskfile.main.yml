# Complete development and deployment pipeline
# Integrates frontend, backend, gateway, and Spin/Fermyon deployment
#
# NOTE: Backend and gateway directories are not yet implemented.
# This taskfile contains stubs for future implementation.
# Currently only frontend is operational.

version: "3"

includes:
  frontend:
    taskfile: ./Taskfile.frontend.yml
    dir: ..
    optional: false
  # Backend and gateway taskfiles don't exist yet - marked optional for future implementation
  backend:
    taskfile: ./Taskfile.backend.yml
    dir: ..
    optional: true
  gateway:
    taskfile: ./Taskfile.gateway.yml
    dir: ..
    optional: true
  spin:
    taskfile: ./Taskfile.spin.yml
    dir: ..
    optional: true

vars:
  ENVIRONMENT: '{{.ENVIRONMENT | default "development"}}'
  NODE_ENV: '{{.NODE_ENV | default "development"}}'
  RUST_LOG: '{{.RUST_LOG | default "debug"}}'
  SPIN_REGISTRY: '{{.SPIN_REGISTRY | default "ghcr.io"}}'
  SPIN_APP_NAME: '{{.SPIN_APP_NAME | default "albergue-carrascalejo"}}'

env:
  ENVIRONMENT: "{{.ENVIRONMENT}}"
  NODE_ENV: "{{.NODE_ENV}}"
  RUST_LOG: "{{.RUST_LOG}}"
  SPIN_REGISTRY: "{{.SPIN_REGISTRY}}"
  SPIN_APP_NAME: "{{.SPIN_APP_NAME}}"

tasks:
  # Main development workflow
  dev:
    desc: Start complete development environment
    cmds:
      - echo "🚀 Starting complete development environment..."
      - task: dev:all

  dev:all:
    desc: Start all services in development mode
    deps: [dev:check-deps, dev:setup-env]
    cmds:
      - echo "🚀 Starting all development services..."
      - 'echo "NOTE: Backend and gateway services are not yet implemented"'
      - task: dev:frontend
      - echo "✅ Frontend started in development mode"
      - 'echo "Frontend: http://localhost:4321"'

  dev:frontend:
    desc: Start frontend development server
    cmds:
      - task: frontend:frontend:dev

  # STUB: Gateway tasks (not implemented yet)
  dev:gateway:
    desc: Start gateway in development mode (STUB - not implemented)
    cmds:
      - echo "⚠️  Gateway not implemented yet"
      - exit 1

  # STUB: Backend tasks (not implemented yet)
  dev:backend:
    desc: Start backend services in development mode (STUB - not implemented)
    cmds:
      - echo "⚠️  Backend not implemented yet"
      - exit 1

  # STUB: Spin tasks (not implemented yet)
  dev:spin:
    desc: Start Spin development environment (STUB - not implemented)
    cmds:
      - echo "⚠️  Spin services not implemented yet"
      - exit 1

  # Build pipeline
  build:
    desc: Build all services for production
    deps: [build:check-deps]
    cmds:
      - echo "🏗️ Building all services for production..."
      - task: build:frontend
      - echo "⚠️  Backend and gateway not implemented yet - skipping"
      - echo "✅ Frontend built successfully"

  build:frontend:
    desc: Build frontend for production
    cmds:
      - task: frontend:frontend:build

  # STUB: Backend build (not implemented yet)
  build:backend:
    desc: Build backend services (STUB - not implemented)
    cmds:
      - echo "⚠️  Backend not implemented yet"
      - exit 1

  # STUB: Gateway build (not implemented yet)
  build:gateway:
    desc: Build gateway service (STUB - not implemented)
    cmds:
      - echo "⚠️  Gateway not implemented yet"
      - exit 1

  # STUB: Spin build (not implemented yet)
  build:spin:
    desc: Build Spin WASM components (STUB - not implemented)
    cmds:
      - echo "⚠️  Spin services not implemented yet"
      - exit 1

  # Testing pipeline
  test:
    desc: Run all tests
    cmds:
      - echo "🧪 Running complete test suite..."
      - task: test:frontend
      - echo "⚠️  Backend and integration tests not implemented yet - skipping"
      - echo "✅ Frontend tests completed"

  test:frontend:
    desc: Run frontend tests
    cmds:
      - task: frontend:frontend:test

  # STUB: Backend tests (not implemented yet)
  test:backend:
    desc: Run backend tests (STUB - not implemented)
    cmds:
      - echo "⚠️  Backend not implemented yet"
      - exit 1

  # STUB: Integration tests (not implemented yet)
  test:integration:
    desc: Run integration tests (STUB - not implemented)
    cmds:
      - echo "⚠️  Integration tests not implemented yet"
      - exit 1

  # Quality assurance
  quality:
    desc: Run all quality checks
    cmds:
      - echo "🔍 Running quality checks..."
      - task: quality:frontend
      - echo "⚠️  Backend and gateway quality checks not implemented yet - skipping"
      - echo "✅ Frontend quality checks completed"

  quality:frontend:
    desc: Run frontend quality checks
    cmds:
      - task: frontend:frontend:quality

  # STUB: Backend quality checks (not implemented yet)
  quality:backend:
    desc: Run backend quality checks (STUB - not implemented)
    cmds:
      - echo "⚠️  Backend not implemented yet"
      - exit 1

  # STUB: Gateway quality checks (not implemented yet)
  quality:gateway:
    desc: Run gateway quality checks (STUB - not implemented)
    cmds:
      - echo "⚠️  Gateway not implemented yet"
      - exit 1

  # Deployment pipeline
  deploy:
    desc: Deploy to production
    deps: [deploy:check-deps, deploy:validate]
    cmds:
      - echo "🚀 Deploying to production..."
      - echo "⚠️  Deployment not implemented yet"
      - exit 1

  # STUB: Fermyon deployment (not implemented yet)
  deploy:fermyon:
    desc: Deploy to Fermyon Cloud (STUB - not implemented)
    cmds:
      - echo "⚠️  Fermyon deployment not implemented yet"
      - exit 1

  # STUB: Staging deployment (not implemented yet)
  deploy:staging:
    desc: Deploy to staging environment (STUB - not implemented)
    cmds:
      - echo "⚠️  Staging deployment not implemented yet"
      - exit 1

  # STUB: Local deployment (not implemented yet)
  deploy:local:
    desc: Deploy locally with Spin (STUB - not implemented)
    cmds:
      - echo "⚠️  Local deployment not implemented yet"
      - exit 1

  # Utility tasks
  clean:
    desc: Clean all build artifacts
    cmds:
      - echo "🧹 Cleaning build artifacts..."
      - task: frontend:frontend:clean
      - echo "⚠️  Backend, gateway, and Spin clean not implemented yet - skipping"
      - echo "✅ Frontend artifacts cleaned"

  setup:
    desc: Complete environment setup
    cmds:
      - echo "⚙️ Setting up development environment..."
      - task: setup:deps
      - echo "⚠️  Database and config setup not fully implemented yet"
      - echo "✅ Environment setup completed"

  setup:deps:
    desc: Install all dependencies
    cmds:
      - echo "📦 Installing dependencies..."
      - task: frontend:frontend:install
      - echo "⚠️  Backend and gateway dependencies not implemented yet - skipping"
      - echo "✅ Frontend dependencies installed"

  # STUB: Database setup (not implemented yet)
  setup:db:
    desc: Setup databases (STUB - not implemented)
    cmds:
      - echo "⚠️  Database setup not implemented yet"
      - exit 1

  # STUB: Config setup (not implemented yet)
  setup:config:
    desc: Setup configuration files (STUB - not implemented)
    cmds:
      - echo "⚠️  Config setup not implemented yet"
      - exit 1

  # Configuration management
  config:
    desc: Manage configuration
    cmds:
      - echo "⚙️ Configuration management..."
      - task: config:validate

  config:validate:
    desc: Validate configuration
    cmds:
      - echo "🔍 Validating configuration..."
      - task: frontend:frontend:check-env
      - echo "⚠️  Backend and gateway config validation not implemented yet - skipping"
      - echo "✅ Frontend configuration validated"

  # STUB: Config generation (not implemented yet)
  config:generate:
    desc: Generate configuration files (STUB - not implemented)
    cmds:
      - echo "⚠️  Config generation not implemented yet"
      - exit 1

  # Health checks
  health:
    desc: Check service health
    cmds:
      - echo "🏥 Checking service health..."
      - task: health:frontend
      - echo "⚠️  Backend, gateway, and Spin health checks not implemented yet - skipping"
      - echo "✅ Frontend health check completed"

  health:frontend:
    desc: Check frontend health
    cmds:
      - echo "🌐 Checking frontend health..."
      - curl -f http://localhost:4321/ || echo "⚠️  Frontend not responding"

  # STUB: Backend health (not implemented yet)
  health:backend:
    desc: Check backend health (STUB - not implemented)
    cmds:
      - echo "⚠️  Backend not implemented yet"
      - exit 1

  # STUB: Gateway health (not implemented yet)
  health:gateway:
    desc: Check gateway health (STUB - not implemented)
    cmds:
      - echo "⚠️  Gateway not implemented yet"
      - exit 1

  # STUB: Spin health (not implemented yet)
  health:spin:
    desc: Check Spin health (STUB - not implemented)
    cmds:
      - echo "⚠️  Spin not implemented yet"
      - exit 1

  # Dependency checks
  dev:check-deps:
    desc: Check development dependencies
    cmds:
      - echo "🔍 Checking development dependencies..."
      - command -v pnpm >/dev/null 2>&1 || { echo "❌ pnpm not found"; exit 1; }
      - echo "⚠️  Rust toolchain and Spin not required for frontend-only mode"
      - echo "✅ Frontend dependencies available"

  deploy:check-deps:
    desc: Check deployment dependencies
    cmds:
      - echo "🔍 Checking deployment dependencies..."
      - echo "⚠️  Deployment not implemented yet"
      - exit 1

  deploy:validate:
    desc: Validate deployment configuration
    cmds:
      - echo "✅ Validating deployment configuration..."
      - echo "⚠️  Deployment not implemented yet"
      - exit 1

  # Default task
  default:
    desc: Show available tasks
    cmds:
      - echo "🎯 Albergue Municipal Carrascalejo - Development & Deployment"
      - echo ""
      - 'echo "Current Status: Frontend operational, backend/gateway not yet implemented"'
      - echo ""
      - 'echo "Available tasks:"'
      - echo "  task dev          - Start development environment (frontend only)"
      - echo "  task build        - Build all services (frontend only currently)"
      - echo "  task test         - Run all tests (frontend only currently)"
      - echo "  task quality      - Run quality checks (frontend only currently)"
      - echo "  task clean        - Clean build artifacts (frontend only currently)"
      - echo "  task health       - Check service health (frontend only currently)"
      - echo ""
      - 'echo "For frontend-specific tasks, use: task frontend --list"'
      - echo "For more details, run task --list-all"



