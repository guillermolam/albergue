version: "3"

includes:
  # Frontend-only taskfile (currently active)
  frontend:
    taskfile: ./taskfiles/Taskfile.frontend.yml
    dir: .
    optional: false

  # Optional taskfiles for future backend/gateway implementation
  # These are marked as optional since backend/ and gateway/ directories don't exist yet
  main:
    taskfile: ./taskfiles/Taskfile.main.yml
    dir: .
    optional: true
  dev:
    taskfile: ./taskfiles/Taskfile.dev.yml
    dir: .
    optional: true
  test:
    taskfile: ./taskfiles/Taskfile.test.yml
    dir: .
    optional: true
  build:
    taskfile: ./taskfiles/Taskfile.build.yml
    dir: .
    optional: true
  quality:
    taskfile: ./taskfiles/Taskfile.quality.yml
    dir: .
    optional: true
  clean:
    taskfile: ./taskfiles/Taskfile.clean.yml
    dir: .
    optional: true
  setup:
    taskfile: ./taskfiles/Taskfile.setup.yml
    dir: .
    optional: true
  deploy:
    taskfile: ./taskfiles/Taskfile.deploy.yml
    dir: .
    optional: true
  connectivity:
    taskfile: ./taskfiles/Taskfile.connectivity.yml
    dir: .
    optional: true
  spin:
    taskfile: ./taskfiles/Taskfile.spin.yml
    dir: .
    optional: true

  # Utility taskfiles
  ports:
    taskfile: ./taskfiles/Taskfile.ports.yml
    dir: .
    optional: false
  act:
    taskfile: ./taskfiles/Taskfile.act.yml
    dir: .
    optional: true
  cloudflare:
    taskfile: ./taskfiles/Taskfile.pages.yml
    dir: .
    optional: true
  github:
    taskfile: ./taskfiles/Taskfile.github.yml
    dir: .
    optional: true
  arch:
    taskfile: ./taskfiles/Taskfile.arch.yml
    dir: .
    optional: true
  turso:
    taskfile: ./taskfiles/Taskfile.turso.yml
    dir: .
    optional: true
  security:
    taskfile: ./taskfiles/Taskfile.security.yml
    dir: .
    optional: true

env:
  RUST_BACKTRACE: "1"
  RUST_LOG: debug
  NODE_ENV: development
  # Database URL should be set via environment variables or KV store
  # DATABASE_URL: postgresql://localhost:5432/albergue_dev

tasks:
  # Root-level convenience tasks that delegate to included taskfiles
  default:
    desc: Start development mode (default task)
    cmds:
      - task: frontend:frontend:dev

  # Development shortcuts (frontend only)
  dev:
    desc: Start frontend development server
    deps: [ports:show]
    cmds:
      - task: frontend:frontend:dev

  # Build shortcuts (frontend only)
  build:
    desc: Build frontend for production
    cmds:
      - task: frontend:frontend:build

  deploy-frontend:
    desc: Choose Cloudflare, Netlify, or Stormkit for frontend deployment
    cmds:
      - task: frontend:frontend:deploy

  # Test shortcuts (frontend only)
  test:
    desc: Run frontend tests
    cmds:
      - task: frontend:frontend:test

  # Quality shortcuts (frontend only)
  fmt:
    desc: Format frontend code
    cmds:
      - task: frontend:frontend:format

  lint:
    desc: Lint frontend code
    cmds:
      - task: frontend:frontend:lint

  type-check:
    desc: Run TypeScript type checking
    cmds:
      - task: frontend:frontend:type-check

  # Clean shortcut (frontend only)
  clean:
    desc: Clean frontend build artifacts
    cmds:
      - task: frontend:frontend:clean

  # Generate project tree
  generate:tree:
    desc: Generate ASCII project tree via Rust Script (respects .gitignore)
    cmds:
      - |
        command -v cargo >/dev/null 2>&1 || { echo "ERROR: Rust toolchain not found. Please install via rustup."; exit 1; }
        if ! command -v rust-script >/dev/null 2>&1; then
          echo "Installing rust-script..."
          cargo install rust-script
        fi
        chmod +x scripts/generate-project-structure.rs
        scripts/generate-project-structure.rs
