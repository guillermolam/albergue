packages:
  - "frontend"
  - "backend"
  - "domain_model"
  - "packages/api-contract"

overrides:
  "@netlify/vite-plugin": "3.0.1"
  esbuild@<=0.24.2: ^0.25.0
  serialize-javascript@<=7.0.2: ^7.0.3
  sharp@<0.35.0: ^0.35.0
  sharp@<0.35.4: ^0.35.4

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  netlify-cli: true
  sharp: true
  unix-dgram: true
  workerd: true

minimumReleaseAgeExclude:
  - miniflare@5.20260910.0-alpha
  - wrangler@4.131.0

peerDependencyRules:
  ignoreMissing:
    - "@netlify/blobs"
    - "@opentelemetry/api"
    - "rollup"
  allowAny:
    - "@netlify/blobs"
    - "@opentelemetry/api"
    - "rollup"
